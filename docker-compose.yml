version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: atlas-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - 5674:5432
    networks:
      - atlas-net
  atlas-server:
    build: ./atlas-server
    container_name: atlas-server
    restart: always
    environment:
      PORT: 5675
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      NOTION_API_KEY: ${NOTION_API_KEY}
      NOTION_PIECE_DS_ID: ${NOTION_PIECE_DS_ID}
      NOTION_MONTHLY_DS_ID: ${NOTION_MONTHLY_DS_ID}
      NOTION_WEEKLY_DS_ID: ${NOTION_WEEKLY_DS_ID}
      NOTION_DIARY_DS_ID: ${NOTION_DIARY_DS_ID}
      NOTION_DATABASE_ID: ${NOTION_DATABASE_ID}
      NOTION_MONTHLY_DB_ID: ${NOTION_MONTHLY_DB_ID}
      NOTION_WEEKLY_DB_ID: ${NOTION_WEEKLY_DB_ID}
      NOTION_DIARY_DB_ID: ${NOTION_DIARY_DB_ID}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_API_KEY_CHARGED: ${GEMINI_API_KEY_CHARGED}
      IMMICH_API_URL: ${IMMICH_API_URL}
      IMMICH_API_KEY: ${IMMICH_API_KEY}
      PAPERLESS_API_URL: ${PAPERLESS_API_URL}
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN}
      ATLAS_API_KEY: ${ATLAS_API_KEY}
      ATLAS_PASSWORD: ${ATLAS_PASSWORD}
    volumes:
      - ./atlas-server:/app # コードをマウント（ホットリロード用）
      - /app/node_modules # NASとの同期から除外（高速化）
    ports:
      - '5675:5675'
    depends_on:
      - db
    networks:
      - atlas-net
  gleis:
    build:
      context: ./gleis
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_API_KEY=${NEXT_PUBLIC_API_KEY}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
    container_name: gleis
    restart: always
    environment:
      PORT: 5676
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    #command: npm run dev #開発モードではこのコマンドをオーバーライドする
    #volumes:
    #- ./gleis:/app #開発モードにするときはマウントする
    #- /app/node_modules
    #- /app/.next
    ports:
      - '5676:5676'
    depends_on:
      - atlas-server
    networks:
      - atlas-net
  trails:
    build:
      context: ./trails
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_API_KEY=${NEXT_PUBLIC_API_KEY}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
    container_name: trails
    restart: always
    environment:
      PORT: 5677
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY}
    #volumes:
    #  - ./trails:/app
    #  - /app/node_modules # NASとの同期から除外（高速化）
    ports:
      - '5677:5677'
    depends_on:
      - atlas-server
    networks:
      - atlas-net

  vista:
    build:
      context: ./vista
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_API_KEY=${NEXT_PUBLIC_API_KEY}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
    container_name: vista
    restart: always
    environment:
      PORT: 5673
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY}
    #volumes:
    #  - ./vista:/app
    #  - /app/node_modules # NASとの同期から除外（高速化）
    ports:
      - '5673:5673'
    depends_on:
      - atlas-server
    networks:
      - atlas-net

networks:
  atlas-net:
    driver: bridge
