name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  atlas-server:
    name: atlas-server (typecheck, test & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: atlas-server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend-workspaces:
    name: shared, gleis & trails (typecheck, test & build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:gleis
      - run: npm run build:trails
